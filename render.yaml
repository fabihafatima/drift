services:
  - type: web
    name: drift-api
    runtime: python
    plan: free
    rootDir: api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn drift.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DRIFT_SECRET
        generateValue: true
      - key: DRIFT_CORS
        sync: false
      - key: DRIFT_CORS_REGEX
        value: https://drift-[a-z0-9-]+\.vercel\.app
